# /etc/rauc/system.conf — Lesson 17, Step 1. Ships in BOTH slots (it is in the image).
[system]
# A hardware lock, and the cheapest safety feature you will ever ship.
# Put the hardware revision in it; change it when the hardware changes.
compatible=example-vms-appliance-x86-64
bootloader=grub
grubenv=/boot/efi/grubenv
# data-directory, not the deprecated statusfile: per-slot state must survive
# both slots being replaced, so it lives on the data partition.
data-directory=/data/rauc
# The default bundle format is still the legacy `plain`. Refuse it outright.
bundle-formats=-plain

[keyring]
# Trust anchors ONLY — the root. Intermediates travel inside the bundle.
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/vda2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/vda3
type=ext4
bootname=B
