# /boot/efi/EFI/BOOT/grub.cfg — Lesson 18, Step 2. Written by hand, never by update-grub.
# GRUB owns slot selection; RAUC only reads and writes the variables.
# Rule: boot the first slot in ORDER where OK == 1 and TRY == 0.
# One attempt per slot: the absence of a success signal IS the failure signal.
set timeout=3

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
# The environment lives on the ESP, outside both slots, or an update wipes
# the record of what to boot.
load_env --file=(hd0,gpt1)/grubenv

# --- choose a slot -------------------------------------------------
set default=9
for SLOT in $ORDER; do
    if [ "$SLOT" == "A" ]; then
        INDEX=0 ; OK=$A_OK ; TRY=$A_TRY ; A_TRY=1
    fi
    if [ "$SLOT" == "B" ]; then
        INDEX=1 ; OK=$B_OK ; TRY=$B_TRY ; B_TRY=1
    fi
    if [ "$OK" -eq 1 -a "$TRY" -eq 0 ]; then
        set default=$INDEX
        break
    fi
done

# --- nothing bootable: clear the try flags and fall through --------
if [ "$default" -eq 9 ]; then
    if [ "$A_OK" -eq 1 -a "$A_TRY" -eq 1 ]; then set A_TRY=0 ; fi
    if [ "$B_OK" -eq 1 -a "$B_TRY" -eq 1 ]; then set B_TRY=0 ; fi
    set default=0
fi

save_env --file=(hd0,gpt1)/grubenv A_TRY A_OK B_TRY B_OK ORDER

# The titles print the state machine so it can be read off the menu.
menuentry "Slot A (OK=$A_OK TRY=$A_TRY)" {
    search --no-floppy --label rootfs0 --set root
    linux /vmlinuz root=LABEL=rootfs0 ro console=ttyS0,115200 rauc.slot=A
    initrd /initrd.img
}

menuentry "Slot B (OK=$B_OK TRY=$B_TRY)" {
    search --no-floppy --label rootfs1 --set root
    linux /vmlinuz root=LABEL=rootfs1 ro console=ttyS0,115200 rauc.slot=B
    initrd /initrd.img
}
