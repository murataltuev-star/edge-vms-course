# /etc/containers/storage.conf — Lesson 19, Step 1. IN THE IMAGE, both slots.
# Podman's default graphroot is inside the root filesystem: everything works
# until the first OS update, which overwrites the slot holding every image
# and volume — on a box that then boots successfully, so nothing rolls back.
[storage]
driver = "overlay"
graphroot = "/data/containers/storage"
runroot = "/run/containers/storage"
